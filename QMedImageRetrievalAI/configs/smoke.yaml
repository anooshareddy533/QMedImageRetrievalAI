project: QMedImageRetrievalAI
seed: 0
data:
  manifest: outputs/smoke/manifest.csv
  image_size: 48
  batch_size: 4
  workers: 0
  min_quality: 0.0
  quality_filter: false
  image_channels: 4
  roi_policy: none
model:
  backbone: tiny
  pretrained: false
  transformer_layers: 1
  transformer_heads: 8
  transformer_tokens_per_scale: 4
  feature_dim: 512
  dropout: 0.1
  quantum_backend: torch
  quantum_device: auto
  qubits: 8
  quantum_layers: 4
  projected_dim: 64
  embedding_dim: 128
  use_alignment: true
  use_mri_attention: true
training:
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  patience: 2
  num_seeds: 1
  contrastive_margin: 1.0
  triplet_margin: 0.3
  lambda_alignment: 0.5
  lambda_contrastive: 1.0
  lambda_triplet: 1.0
  lambda_regularization: 0.1
  max_batches_per_epoch: 1
  grad_clip_norm: 1.0
  amp: false
  monitor_k: 5
  val_max_queries: 12
  device: cpu
  balanced_sampling: true
retrieval:
  index: exact
  nlist: 4
  hnsw_m: 8
  nprobe: 2
  candidate_multiplier: 10
  k_values: [5, 10]
  ranking_alpha: 0.7
  ranking_beta: 0.1
  ranking_gamma: 0.2
  use_label_aware_rerank: false
