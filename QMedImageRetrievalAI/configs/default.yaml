project: QMedImageRetrievalAI
seed: 0
data:
  manifest: data/manifest.csv
  image_size: 224
  batch_size: 32
  workers: 4
  min_quality: 0.35
  quality_filter: false  # requires calibration on validation data; no uncalibrated data removal
  image_channels: 4
  roi_policy: none       # image-only is primary; "supplied" enables optional annotation ROIs
model:
  backbone: resnet50    # resnet50 or tiny; random initialization unless pretrained: true
  pretrained: false
  transformer_layers: 2
  transformer_heads: 8
  transformer_tokens_per_scale: 16
  feature_dim: 512
  dropout: 0.3
  quantum_backend: torch  # torch (verified differentiable statevector), pennylane, none
  quantum_device: auto   # lightning.gpu / lightning.qubit when backend=pennylane
  qubits: 8
  quantum_layers: 4
  projected_dim: 64
  embedding_dim: 128
  use_alignment: true
  use_mri_attention: true
training:
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.00001
  patience: 10
  num_seeds: 5
  contrastive_margin: 1.0
  triplet_margin: 0.3
  lambda_alignment: 0.5
  lambda_contrastive: 1.0
  lambda_triplet: 1.0
  lambda_regularization: 0.1
  max_batches_per_epoch: 0
  grad_clip_norm: 1.0
  amp: false
  monitor_k: 10
  val_max_queries: 0
  device: auto
  balanced_sampling: true
retrieval:
  index: faiss_ivf   # faiss_ivf, faiss_flat, exact; auto-falls back to exact without FAISS
  nlist: 1024
  hnsw_m: 32
  nprobe: 16
  candidate_multiplier: 20
  k_values: [5, 10, 20]
  ranking_alpha: 0.7
  ranking_beta: 0.1
  ranking_gamma: 0.2
  use_label_aware_rerank: false
